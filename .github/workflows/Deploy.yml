name: Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:

    runs-on: macos-26
    defaults:
      run:
        working-directory: ./EssentialApp

    steps:
    - uses: actions/checkout@v6

    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode_26.4.app

    - name: Xcode version
      run: /usr/bin/xcodebuild -version

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    - name: Install Bundler Dependencies
      run: bundle install

    - name: Set up SSH for Match
      env:
        SSH_KEY: ${{ secrets.MATCH_REPO_SSH_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts

    - name: Decode Apple API .p8 Key
      env:
        P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT_BASE64 }}
      run: echo "$P8_BASE64" | base64 --decode > ./fastlane/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}.p8

    - name: Build and Deploy iOS App
      env:
          # Inject the secrets into the environment variables Fastlane expects
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_FILEPATH: "./fastlane/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}.p8"
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      run: bundle exec fastlane Deploy_From_CI