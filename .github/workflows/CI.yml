name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:

    runs-on: macos-26

    steps:
    - uses: actions/checkout@v6

    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode_26.3.app

    - name: Build And Test Platform Independent
      run: >
        xcodebuild clean build test
        -project EssentialFeed/EssentialFeed.xcodeproj
        -scheme "CI_macOS"
        -sdk macosx
        -destination "platform=macOS"
        CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO ONLY_ACTIVE_ARCH=YES

    - name: Build And Test iOS Platform Independent
      run: >
        xcodebuild clean build test
        -workspace EssentialApp/EssentialApp.xcworkspace
        -scheme "CI_iOS"
        -sdk iphonesimulator
        -destination "platform=iOS Simulator,OS=26.4,name=iPhone 17 Pro"
        CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO ONLY_ACTIVE_ARCH=YES